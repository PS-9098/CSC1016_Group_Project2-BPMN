<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Renew Permit</title></head>
<body style="font-family:sans-serif;max-width:500px;margin:40px auto;padding:0 16px;">
  <h2>Permit Renewal</h2>
  <form>
    <p><label>Permit holder name:<br><input type="text" style="width:100%;padding:8px;" required></label></p>
    <p><label>Current permit ID:<br><input type="text" style="width:100%;padding:8px;" placeholder="e.g., P-12345"></label></p>
    <p><label>Vehicle plate:<br><input type="text" style="width:100%;padding:8px;"></label></p>
    <p><label>University ID:<br><input type="text" style="width:100%;padding:8px;"></label></p>
    <p><label><input type="checkbox"> I confirm no unpaid fines</label></p>
    <p><button type="submit" style="background:#1e6f5c;color:white;border:none;padding:10px 20px;cursor:pointer;">Submit Renewal</button></p>
  </form>
  <p style="font-size:12px;">Process 6: eligibility re-check (ID, fines) → payment → new permit</p>
</body>
</html>
