<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Apply for Permit</title></head>
<body style="font-family:sans-serif;max-width:500px;margin:40px auto;padding:0 16px;">
  <h2>Parking Permit Application</h2>
  <form>
    <p><label>Full name:<br><input type="text" style="width:100%;padding:8px;" required></label></p>
    <p><label>University ID:<br><input type="text" style="width:100%;padding:8px;"></label></p>
    <p><label>Email:<br><input type="email" style="width:100%;padding:8px;"></label></p>
    <p><label>Role:<br><select style="width:100%;padding:8px;"><option>Staff</option><option>Student</option></select></label></p>
    <p><label>Vehicle plate:<br><input type="text" style="width:100%;padding:8px;"></label></p>
    <p><label><input type="checkbox"> I have no unpaid fines</label></p>
    <p><button type="submit" style="background:#1e6f5c;color:white;border:none;padding:10px 20px;cursor:pointer;">Submit</button></p>
  </form>
  <p style="font-size:12px;">Process 1: eligibility & ID checks</p>
</body>
</html>
